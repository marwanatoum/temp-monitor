<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Temp Monitor — Devices</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<script src="{{ url_for('static', filename='i18n.js') }}"></script>
</head>
<body>

<div class="scanlines" aria-hidden="true"></div>

<header class="topbar">
  <div class="brand">
    <span class="brand-dot"></span>
    <span class="brand-text" data-i18n="brand_text">غرفة المراقبة</span>
  </div>

  <nav class="nav-links">
    <a href="{{ url_for('dashboard') }}" class="nav-link" data-i18n="nav_dashboard">اللوحة</a>
    <a href="{{ url_for('devices_page') }}" class="nav-link active" data-i18n="nav_devices">إدارة الأجهزة</a>
    <a href="{{ url_for('map_page') }}" class="nav-link" data-i18n="nav_map">الخريطة</a>
  </nav>

  <div class="topbar-controls">
    <div class="lang-switch">
      <button class="lang-btn" data-lang="ar" onclick="setLang('ar')">AR</button>
      <button class="lang-btn" data-lang="fr" onclick="setLang('fr')">FR</button>
      <button class="lang-btn" data-lang="en" onclick="setLang('en')">EN</button>
    </div>
    <label class="theme-switch" title="Dark / Light">
      <input type="checkbox" id="theme-toggle" onchange="toggleTheme()">
      <span class="theme-slider">
        <span class="theme-icon sun">☀</span>
        <span class="theme-icon moon">☾</span>
      </span>
    </label>
    <div class="status">
      <span class="user-chip">{{ username }}</span>
      <a href="{{ url_for('logout') }}" class="logout-link" data-i18n="logout">خروج</a>
    </div>
  </div>
</header>

<main class="layout">

  <section class="form-card">
    <h2 id="form-title" data-i18n="add_device_title">إضافة جهاز جديد</h2>

    <div id="form-error" class="lcd-error show" style="display:none; margin-bottom:14px;"></div>
    <div id="form-success" class="lcd-error show" style="display:none; margin-bottom:14px; border-color:var(--green); background:rgba(63,224,122,0.1); color:var(--green);"></div>

    <div class="form-row">
      <div class="form-field">
        <label for="f-device-id" data-i18n="field_device_id">معرّف الجهاز (device_id)</label>
        <input type="text" id="f-device-id" placeholder="am2302b-1">
      </div>
      <div class="form-field">
        <label for="f-description" data-i18n="field_description">وصف قصير (اختياري)</label>
        <input type="text" id="f-description" placeholder="">
      </div>
    </div>

    <div class="form-row">
      <div class="form-field">
        <label for="f-lat" data-i18n="field_lat">خط العرض (اختياري)</label>
        <input type="number" step="any" id="f-lat" placeholder="30.4278">
      </div>
      <div class="form-field">
        <label for="f-lng" data-i18n="field_lng">خط الطول (اختياري)</label>
        <input type="number" step="any" id="f-lng" placeholder="-9.5981">
      </div>
    </div>

    <div class="form-row">
      <div class="form-field">
        <label for="f-temp-min" data-i18n="field_temp_min">الحرارة الدنيا °C (اختياري)</label>
        <input type="number" step="any" id="f-temp-min" placeholder="2">
      </div>
      <div class="form-field">
        <label for="f-temp-max" data-i18n="field_temp_max">الحرارة القصوى °C (اختياري)</label>
        <input type="number" step="any" id="f-temp-max" placeholder="8">
      </div>
    </div>

    <h2 data-i18n="tags_title" style="margin-top:18px;">قيم إضافية (Tags) — اختياري</h2>
    <div class="tags-list" id="tags-list"></div>
    <button class="btn btn-ghost" id="add-tag-btn" type="button" data-i18n="add_tag_btn">➕ إضافة tag</button>

    <div style="margin-top:20px; display:flex; gap:10px;">
      <button class="btn btn-primary" id="save-device-btn" data-i18n="save_device_btn">حفظ الجهاز</button>
      <button class="btn btn-ghost" id="cancel-edit-btn" data-i18n="cancel_edit_btn" style="display:none;">إلغاء</button>
    </div>
  </section>

  <section style="margin-top:26px;">
    <h2 data-i18n="devices_list_title">الأجهزة المسجلة</h2>
    <div class="devices-list" id="devices-list"></div>
  </section>

</main>

<script src="{{ url_for('static', filename='devices.js') }}"></script>
</body>
</html>
